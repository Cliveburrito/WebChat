worker_processes auto;

events {
    # Keep enough worker capacity for concurrent API requests and long-lived chat sockets.
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide the exact Nginx version in error pages and the Server header.
    server_tokens off;

    # A structured access log makes throttling, upstream latency, and abusive paths easier to debug.
    log_format webchat_edge
        '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time '
        'ua="$upstream_addr" us="$upstream_status" '
        'req_id="$request_id" limit_req="$limit_req_status" limit_conn="$limit_conn_status"';

    access_log /var/log/nginx/access.log webchat_edge;
    error_log /var/log/nginx/error.log notice;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    types_hash_max_size 4096;

    # Buffer request bodies at Nginx first so slow clients do not tie up backend request threads.
    client_body_buffer_size 256k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    client_max_body_size 20m;
    send_timeout 30s;

    # Return 429 for both request-rate and connection-limit rejections.
    limit_req_status 429;
    limit_conn_status 429;

    # Per-IP zones. Rates are intentionally conservative for a chat app with bursts on page load.
    limit_req_zone $binary_remote_addr zone=api_per_ip:20m rate=180r/m;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=ws_per_ip:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;

    # WebSocket upgrade helper. Non-upgrade requests get a closed Connection header.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Method allowlists keep obviously wrong traffic from reaching the application.
    map $request_method $api_method_blocked {
        default 1;
        GET 0;
        HEAD 0;
        POST 0;
        PUT 0;
        PATCH 0;
        DELETE 0;
        OPTIONS 0;
    }

    map $request_method $auth_method_blocked {
        default 1;
        POST 0;
        OPTIONS 0;
    }

    # SockJS uses GET/POST/OPTIONS subrequests under /ws, even when native WebSocket is unavailable.
    map $request_method $ws_method_blocked {
        default 1;
        GET 0;
        POST 0;
        OPTIONS 0;
    }

    # Optional compression for text assets and JSON. Avoid compressing already-compressed media.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    upstream webchat_frontend {
        server frontend:80;
        keepalive 32;
    }

    upstream webchat_backend {
        server backend:8080;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        # Baseline connection cap per IP. Location-specific limits below are stricter where needed.
        limit_conn conn_per_ip 60;

        # Security headers that are safe for the current SPA/API/WebSocket shape.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self' data:;" always;
        # Optional when this server block is served only over HTTPS:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Drop common scanner noise based on requested paths, not fake bot identity claims.
        location ~* ^/(?:wp-admin|wp-login\.php|xmlrpc\.php|\.env|\.git|composer\.(?:json|lock)|vendor/) {
            return 444;
        }

        # Auth endpoints get tighter limits because login/register/refresh/logout are expensive and abuse-prone.
        location ~ ^/api/(?:auth(?:/.*|$)|login/?$|register/?$|password-reset(?:/.*|$)) {
            if ($auth_method_blocked) {
                return 405;
            }

            client_max_body_size 1m;
            limit_conn conn_per_ip 10;
            limit_req zone=auth_per_ip burst=8 nodelay;

            proxy_pass http://webchat_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 5s;
            proxy_send_timeout 20s;
            proxy_read_timeout 30s;
            proxy_buffering on;
            proxy_request_buffering on;
        }

        # General API traffic allows short bursts for active chat usage while protecting backend threads.
        location ^~ /api/ {
            if ($api_method_blocked) {
                return 405;
            }

            client_max_body_size 20m;
            limit_conn conn_per_ip 25;
            limit_req zone=api_per_ip burst=90 nodelay;

            proxy_pass http://webchat_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_request_buffering on;
        }

        # WebSocket/SockJS endpoint. Keep read/send timeouts long and do not buffer upgraded traffic.
        location ~ ^/ws(?:/|$) {
            if ($ws_method_blocked) {
                return 405;
            }

            client_max_body_size 1m;
            limit_conn conn_per_ip 20;
            limit_req zone=ws_per_ip burst=20 nodelay;

            proxy_pass http://webchat_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 5s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Frontend fallback. The frontend container serves the SPA; this keeps non-API routes out of the backend.
        location / {
            limit_conn conn_per_ip 40;

            # The frontend image uses default Nginx static serving. Intercept frontend 404s so deep SPA routes
            # such as /chat/123 still return index.html on direct refresh.
            proxy_intercept_errors on;
            error_page 404 = @frontend_index;

            proxy_pass http://webchat_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        location @frontend_index {
            internal;

            rewrite ^ /index.html break;
            proxy_pass http://webchat_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }
    }
}
