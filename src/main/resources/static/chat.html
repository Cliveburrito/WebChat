<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple WebSocket Chat</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #messages {
            border: 1px solid #ccc; background:#f7f7f7;
            height: 300px; overflow-y: auto; padding: 10px;
            margin-top:10px; margin-bottom: 10px;
        }
        .msg { margin-bottom: 6px; }
        .me   { color:#007bff; font-weight:bold; }
        .other{ color:#28a745; font-weight:bold; }
        .time { font-size:0.8em; color:#666; margin-left:6px; }
        input{ padding:5px; }
        button{ padding:7px 12px; cursor:pointer; margin-top:4px; }
        .section { border:1px solid #ddd; padding:10px; margin-bottom:15px; }
    </style>
</head>

<body>

<h2>WebSocket Chat</h2>

<div class="section">
    <span>Logged in as: <strong id="currentUserName"></strong></span>
    <button id="logoutBtn" style="float:right;">Logout</button>
    <div style="clear:both;"></div>
</div>

<div class="section">
    Conversation ID: <input id="conversationId" value="1" size="4">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>

    <div id="status" style="margin-top:6px;">Disconnected</div>
</div>

<div id="messages"></div>

<div style="margin-top:10px;">
    <input id="messageInput" type="text" placeholder="Type message..." size="40">
    <button id="sendBtn" disabled>Send</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

<script>
    let stompClient = null;
    let convo = null;

    const TOKEN_KEY = "jwt";
    const USER_KEY = "user";

    const status = document.getElementById("status");
    const log = document.getElementById("messages");
    const currentUserName = document.getElementById("currentUserName");
    const messageInput = document.getElementById("messageInput");

    // ===== Auth check on load =====
    const token = localStorage.getItem(TOKEN_KEY);
    const userJson = localStorage.getItem(USER_KEY);
    let currentUser = null;
    let myUsername = null;

    if (!token || !userJson) {
        // αν δεν είσαι logged in, γύρνα στο login
        window.location.href = "/login.html";
    } else {
        currentUser = JSON.parse(userJson);
        myUsername = currentUser.username;
        currentUserName.innerText = myUsername;
    }

    function connect() {
        convo = document.getElementById("conversationId").value.trim();
        if (!convo) return alert("Enter conversation ID");

        const socket = new SockJS("/ws");
        stompClient = Stomp.over(socket);

        stompClient.connect(
            { Authorization: "Bearer " + token },
            () => {
                console.log("STOMP connected as", myUsername);
                status.innerText = "Connected to chat " + convo;
                toggle(true);

                stompClient.subscribe("/topic/chat/" + convo, msg => {
                    console.log("Raw body:", msg.body);
                    try {
                        const data = JSON.parse(msg.body);
                        // backend: chatMessageResponse(content, senderUsername, ...)
                        const text = data.content ?? data.message ?? msg.body;
                        const sender = data.senderUsername ?? "unknown";
                        const isMe = sender === myUsername;
                        append(text, sender, isMe);
                    } catch (e) {
                        console.error("JSON parse error:", e);
                        append(msg.body, "unknown", false);
                    }
                });
            },
            (error) => {
                console.error("STOMP error:", error);
                status.innerText = "Error connecting";
                toggle(false);
            }
        );
    }

    function send() {
        console.log("send() called");
        const txt = messageInput.value.trim();
        if (!txt || !stompClient) return;

        console.log("Sending to server:", txt);
        stompClient.send("/app/chat/" + convo, {}, txt);
        messageInput.value = "";
    }

    function disconnect() {
        if (stompClient) stompClient.disconnect();
        status.innerText = "Disconnected";
        toggle(false);
    }

    function logout() {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        if (stompClient) {
            stompClient.disconnect();
        }
        window.location.href = "/login.html";
    }

    function append(text, senderUsername, me) {
        const div = document.createElement("div");
        div.classList.add("msg");

        const who = document.createElement("span");
        who.classList.add(me ? "me" : "other");
        who.innerText = me
            ? `Me (${senderUsername}): `
            : `${senderUsername}: `;

        const span = document.createElement("span");
        span.innerText = text;

        const t = document.createElement("span");
        t.classList.add("time");
        t.innerText = " (" + new Date().toLocaleTimeString() + ")";

        div.appendChild(who);
        div.appendChild(span);
        div.appendChild(t);

        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
    }

    function toggle(connected) {
        document.getElementById("connectBtn").disabled = connected;
        document.getElementById("disconnectBtn").disabled = !connected;
        document.getElementById("sendBtn").disabled = !connected;
    }

    document.getElementById("connectBtn").onclick = connect;
    document.getElementById("disconnectBtn").onclick = disconnect;
    document.getElementById("sendBtn").onclick = send;
    document.getElementById("logoutBtn").onclick = logout;

    messageInput.addEventListener("keydown", e => {
        if (e.key === "Enter") {
            e.preventDefault();
            send();
        }
    });
</script>

</body>
</html>
