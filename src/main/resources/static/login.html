<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login / Register</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { border:1px solid #ddd; padding:15px; margin-bottom:20px; }
        input { padding:5px; margin:3px 0; width: 250px; }
        button { padding:7px 12px; cursor:pointer; margin-top:6px; }
        #auth-error { color: red; margin-top: 8px; }
    </style>
</head>
<body>

<h2>WebChat – Login / Register</h2>

<div id="auth-error"></div>

<div class="section">
    <h3>Register</h3>
    <div>
        <label>Username:<br>
            <input type="text" id="reg-username">
        </label>
    </div>
    <div>
        <label>Email:<br>
            <input type="email" id="reg-email">
        </label>
    </div>
    <div>
        <label>Password:<br>
            <input type="password" id="reg-password">
        </label>
    </div>
    <div>
        <label>Avatar URL (optional):<br>
            <input type="text" id="reg-avatar">
        </label>
    </div>
    <button id="registerBtn">Register</button>
</div>

<div class="section">
    <h3>Login</h3>
    <div>
        <label>Username:<br>
            <input type="text" id="login-username">
        </label>
    </div>
    <div>
        <label>Password:<br>
            <input type="password" id="login-password">
        </label>
    </div>
    <button id="loginBtn">Login</button>
</div>

<script>
    const TOKEN_KEY = "jwt";
    const USER_KEY = "user";
    const errorDiv = document.getElementById("auth-error");

    // Αν ήδη έχεις token/user, στείλ' τον κατευθείαν στο chat
    (function redirectIfLoggedIn() {
        const t = localStorage.getItem(TOKEN_KEY);
        const u = localStorage.getItem(USER_KEY);
        if (t && u) {
            window.location.href = "/chat.html";
        }
    })();

    async function register() {
        errorDiv.textContent = "";
        const username = document.getElementById("reg-username").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const password = document.getElementById("reg-password").value.trim();
        const avatarUrl = document.getElementById("reg-avatar").value.trim() || null;

        if (!username || !email || !password) {
            errorDiv.textContent = "Συμπλήρωσε username, email και password";
            return;
        }

        try {
            const res = await fetch("/api/auth/register", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ username, email, password, avatarUrl })
            });

            if (!res.ok) {
                const txt = await res.text();
                console.error("Register failed:", txt);
                errorDiv.textContent = "Register failed: " + txt;
                return;
            }

            const data = await res.json(); // { token, user }
            localStorage.setItem(TOKEN_KEY, data.token);
            localStorage.setItem(USER_KEY, JSON.stringify(data.user));

            window.location.href = "/chat.html";
        } catch (err) {
            console.error(err);
            errorDiv.textContent = "Error during register";
        }
    }

    async function login() {
        errorDiv.textContent = "";
        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value.trim();

        if (!username || !password) {
            errorDiv.textContent = "Συμπλήρωσε username και password";
            return;
        }

        try {
            const res = await fetch("/api/auth/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ username, password })
            });

            if (!res.ok) {
                const txt = await res.text();
                console.error("Login failed:", txt);
                errorDiv.textContent = "Login failed";
                return;
            }

            const data = await res.json(); // { token, user }
            localStorage.setItem(TOKEN_KEY, data.token);
            localStorage.setItem(USER_KEY, JSON.stringify(data.user));

            window.location.href = "/chat.html";
        } catch (err) {
            console.error(err);
            errorDiv.textContent = "Error during login";
        }
    }

    document.getElementById("registerBtn").onclick = register;
    document.getElementById("loginBtn").onclick = login;
</script>

</body>
</html>
