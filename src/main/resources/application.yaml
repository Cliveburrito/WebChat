spring:
  threads:
    virtual:
      enabled: true
  application:
    name: WebChat

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  # Database Configuration (PostgreSQL)
  # The host defaults to 'localhost' for local IDE runs,
  # but can be overridden by 'db' when running in Docker.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/webchat
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate Settings
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: Existing WebChat schema

  # Message Broker (RabbitMQ)
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

  # Cache Layer (Redis)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cache:
    type: simple
    web:
      pageable:
        serialization-mode: via-dto

# Monitoring and Observability (Spring Actuator & Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always # Provides status for DB, Disk, RabbitMQ, etc.
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Custom Application Security Settings
application:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:300000}
    refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:2592000000}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}

  tracking:
    detailed-enabled: ${REQUEST_TRACKING_DETAILED_ENABLED:true}
    slow-request-threshold-ms: ${REQUEST_TRACKING_SLOW_THRESHOLD_MS:2000}

  watermarks:
    write-behind-enabled: ${WATERMARK_WRITE_BEHIND_ENABLED:true}
    flush-batch-size: ${WATERMARK_FLUSH_BATCH_SIZE:500}
    flush-fixed-delay-ms: ${WATERMARK_FLUSH_FIXED_DELAY_MS:5000}
    delivered-receipt-member-limit: ${WATERMARK_DELIVERED_RECEIPT_MEMBER_LIMIT:50}

  storage:
    location: ${STORAGE_PATH:uploads}
    max-file-size: 15728640 # 15MB in bytes
    preview-max-dimension: 200
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
      - video/mp4


  websocket:
    allowed-origins:
      - ${WS_ALLOWED_ORIGIN:http://localhost:5173}

  rabbitmq:
    stomp:
      host: ${RABBIT_HOST:localhost}
      port: 61613
      username: ${RABBIT_USER:guest}
      password: ${RABBIT_PASSWORD:guest}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%5p requestId=%X{requestId} thread=%t logger=%logger{36} msg=%m%n"
  level:
    com.example.WebChat.observability: DEBUG
    # com.example.WebChat.observability: ${REQUEST_TRACKING_LOG_LEVEL:INFO}
    com.example.WebChat.security.JwtAuthenticationFilter: ${AUTH_TRACKING_LOG_LEVEL:INFO}
