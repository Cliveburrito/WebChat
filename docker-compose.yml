version: '3.8'

services:
  # DB
  db:
    image: postgres:18-alpine
    container_name: chat-db
    environment:
      POSTGRES_DB: webchat
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - ./podman-data/postgres:/var/lib/postgresql:Z

  rabbitmq:
    image: rabbitmq:3-management
    container_name: chat-mq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?RABBIT_PASSWORD must be set}
    volumes:
      - mq_data:/var/lib/rabbitmq:Z

  # Cache Layer (Redis)
  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data:Z

  prometheus:
    image: prom/prometheus:latest
    container_name: chat-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:Z
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: chat-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    depends_on:
      - prometheus

  backend:
    build:
      context: .
    container_name: chat-backend
    depends_on:
      - db
      - rabbitmq
      - redis
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER:-guest}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?RABBIT_PASSWORD must be set}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      STORAGE_PATH: /app/uploads
      WS_ALLOWED_ORIGIN: ${WS_ALLOWED_ORIGIN:-http://localhost:8081}
    volumes:
      - ./uploads:/app/uploads:Z
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    container_name: chat-frontend
    depends_on:
      - backend
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    container_name: chat-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "${WEB_PORT:-8081}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z

volumes:
  mq_data:
    name: webchat_mq_data
  redis_data:
    name: webchat_redis_data
